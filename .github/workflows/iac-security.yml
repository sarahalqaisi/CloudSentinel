name: CloudSentinel IaC security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan sample Terraform and generate SARIF
        run: python scripts/scan_iac.py sample-data --sarif reports/cloudsentinel.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudsentinel-sarif
          path: reports/cloudsentinel.sarif
  upload:
    needs: scan
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: cloudsentinel-sarif
          path: reports
      - name: Upload SARIF to GitHub Code Scanning
        continue-on-error: true # Artifact remains available when Code Scanning is disabled or unavailable.
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: reports/cloudsentinel.sarif
