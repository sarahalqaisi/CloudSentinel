name: CloudSentinel CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest
      - name: Validate policies
        run: python -c "from pathlib import Path; from app.services.policies import load_policy_file; files=list(Path('policies').rglob('*.yml')); [load_policy_file(f) for f in files]; print(f'{len(files)} policies valid')"
