{% extends 'base.html' %}{% block content %}<section class="panel"><form class="filter-bar"><select name="scan_id"><option value="">All findings</option>{% for s in scans %}<option value="{{ s.id }}" {{ 'selected' if scan_id==s.id }}>{{ s.name }}</option>{% endfor %}</select><button class="btn btn-secondary">Apply</button></form><div class="compliance-grid">{% for row in matrix %}<article class="compliance-card"><div class="compliance-ring" style="--score:{{ row.score }}"><strong>{{ row.score|round(0)|int }}%</strong></div><div><h3>{{ row.framework }}</h3><p>{{ row.passed }} passed · {{ row.failed }} failed · {{ row.controls }} controls</p><div class="progress"><i style="width:{{ row.score }}%"></i></div></div></article>{% else %}<p class="empty">No compliance controls loaded.</p>{% endfor %}</div></section>{% endblock %}
