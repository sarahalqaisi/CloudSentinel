id: CS-AWS-LMB-001
title: Lambda environment contains possible secrets
description: Detects cloud infrastructure configurations that violate the CloudSentinel
  Baseline security baseline.
severity: critical
category: Secrets
provider: aws
framework: CloudSentinel Baseline
control_id: LAMBDA-SEC-01
scope: resource
resource_types:
- aws_lambda_function
check: lambda_env_secrets
remediation: Store secrets in Secrets Manager or Parameter Store and reference them
  at runtime.
enabled: true
version: 1
