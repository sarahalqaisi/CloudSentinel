id: CS-AWS-RDS-002
title: RDS storage encryption is disabled
description: Detects cloud infrastructure configurations that violate the AWS FSBP
  security baseline.
severity: high
category: Encryption
provider: aws
framework: AWS FSBP
control_id: RDS.3
scope: resource
resource_types:
- aws_db_instance
check: rds_unencrypted
remediation: Enable storage_encrypted and select a customer-managed KMS key where
